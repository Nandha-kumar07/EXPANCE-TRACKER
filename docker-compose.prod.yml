services:
  # Backend API - NOT exposed publicly, only accessible within Docker network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-tracker-backend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://54.158.241.8
    env_file:
      - ./backend/.env
    networks:
      - expense-tracker-network

  # Frontend React App (Production with Nginx)
  # Nginx serves static files AND proxies /api/ to backend internally
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # API goes through nginx on port 80, which proxies to backend container
        - VITE_API_URL=http://54.158.241.8/api
    container_name: expense-tracker-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - expense-tracker-network

networks:
  expense-tracker-network:
    driver: bridge
